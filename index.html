<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <title>Téranga Foot</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;

      color: #1A1A1A;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      background: #fff;

      padding: 40px 32px;

    h1 { color: #00853F; margin: 0 0 12px; font-size: 28px; }
    p { color: #555; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: #00853F;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
    a:hover { background: #0B5C2E; }

</head>
<body>
  <div class="card">
    <h1>Téranga Foot</h1>
    <p>Application mobile dédiée à l'équipe nationale du Sénégal &mdash; matchs, joueurs et actualités des Lions de la Téranga.</p>
